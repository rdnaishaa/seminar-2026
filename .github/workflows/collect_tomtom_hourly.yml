name: Collect TomTom Final64 Hourly

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests python-dotenv

      - name: Run TomTom collector
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          python scripts/live/collect_tomtom_live.py

      - name: Commit updated live data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/collected/tomtom_flow_final64.csv

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: collect hourly TomTom Final64 data"
            git push
          fi